name: Verify public semantic source
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '10.29.3'
      - name: Install locked source tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify standalone public documentation links
        run: node scripts/document-links.mts
      - run: node scripts/verify.mts
      - name: Verify independent public source-owner composition
        run: |
          cargo build --locked --manifest-path fixtures/source-owner-composition/Cargo.toml
          cargo clippy --locked --manifest-path fixtures/source-owner-composition/Cargo.toml --all-targets -- -D warnings
