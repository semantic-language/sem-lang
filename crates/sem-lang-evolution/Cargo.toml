[package]
name = "sem-lang-evolution"
version = "0.10.0"
edition = "2024"
license = "MPL-2.0"
description = "Explicit review workflow for extending semantic definitions."
repository = "https://github.com/semantic-language/sem-lang"
homepage = "https://github.com/semantic-language/sem-lang"
documentation = "https://github.com/semantic-language/sem-lang#readme"
readme = "../../README.md"
rust-version = "1.97"
keywords = ["semantic", "language", "evolution", "extension"]
categories = ["development-tools", "science"]
publish = false

authors = ["sem-lang contributors"]

[dependencies]
sem-lang-core = { version = "=0.10.0", path = "../sem-lang-core" }
sem-lang-frontend = { version = "=0.10.0", path = "../sem-lang-frontend" }
sem-lang-vocab = { version = "=0.10.0", path = "../sem-lang-vocab" }
thiserror.workspace = true
serde.workspace = true
