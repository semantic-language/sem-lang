[package]
name = "sem-lang-runtime"
version = "0.10.0"
edition = "2024"
license = "MPL-2.0"
description = "Deterministic evaluation and normalization for semantic terms."
repository = "https://github.com/semantic-language/sem-lang"
homepage = "https://github.com/semantic-language/sem-lang"
documentation = "https://github.com/semantic-language/sem-lang#readme"
readme = "../../README.md"
rust-version = "1.97"
keywords = ["semantic", "runtime"]
categories = ["development-tools", "science"]
publish = false

authors = ["sem-lang contributors"]

[dependencies]
zixcel-revision = { version = "=0.10.0", default-features = false }
sem-lang-core = { version = "=0.10.0", path = "../sem-lang-core" }
sem-lang-vocab = { version = "=0.10.0", path = "../sem-lang-vocab" }
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
sem-lang-repository = { version = "=0.10.0", path = "../sem-lang-repository" }

[dev-dependencies]
sem-lang-fixtures = { path = "../sem-lang-fixtures" }
