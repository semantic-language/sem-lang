[package]
name = "sem-lang-cli"
version = "0.10.0"
edition = "2024"
license = "MPL-2.0"
description = "Command-line interface for compiling and inspecting semantic language data."
repository = "https://github.com/semantic-language/sem-lang"
homepage = "https://github.com/semantic-language/sem-lang"
documentation = "https://github.com/semantic-language/sem-lang#readme"
readme = "../../README.md"
rust-version = "1.97"
keywords = ["semantic", "language", "cli", "nlp"]
categories = ["development-tools", "command-line-utilities"]
publish = false

[dependencies]
sem-lang-memory = { version = "=0.10.0", path = "../sem-lang-memory" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sem-lang = { version = "=0.10.0", path = "../sem-lang" }
sem-lang-core = { version = "=0.10.0", path = "../sem-lang-core" }
sem-lang-store-fs = { version = "=0.10.0", path = "../sem-lang-store-fs" }
sem-lang-codec = { version = "=0.10.0", path = "../sem-lang-codec" }
sem-lang-repository = { version = "=0.10.0", path = "../sem-lang-repository" }
sem-lang-frontend = { version = "=0.10.0", path = "../sem-lang-frontend" }
sem-lang-language = { version = "=0.10.0", path = "../sem-lang-language" }
sem-lang-vocab = { version = "=0.10.0", path = "../sem-lang-vocab" }
sem-lang-linguistics = { version = "=0.10.0", path = "../sem-lang-linguistics" }
sem-lang-standard = { version = "=0.10.0", path = "../sem-lang-standard" }
sem-lang-context = { version = "=0.10.0", path = "../sem-lang-context" }
sem-lang-tooling = { version = "=0.10.0", path = "../sem-lang-tooling" }

[dev-dependencies]
tempfile = "3.27.0"
