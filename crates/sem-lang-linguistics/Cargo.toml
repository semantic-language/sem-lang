[package]
name = "sem-lang-linguistics"
version = "0.10.0"
edition = "2024"
license = "MPL-2.0"
description = "Stable linguistic kernel and domain-neutral semantic relations."
repository = "https://github.com/semantic-language/sem-lang"
documentation = "https://docs.rs/sem-lang-linguistics"
readme = "README.md"
rust-version = "1.97"
